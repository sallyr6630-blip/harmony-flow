<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eye Care Training — Harmony Flow</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&family=Noto+Serif+JP:wght@200;300;400&family=Noto+Serif+Arabic:wght@300;400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-deep:   #060a12;
      --bg-mid:    #0a0f1e;
      --bg-card:   rgba(255,255,255,0.035);
      --border:    rgba(255,255,255,0.07);
      --primary:   #7ec8e3;
      --primary-g: rgba(126,200,227,0.15);
      --secondary: #a8d5ba;
      --text:      #cdd8e3;
      --muted:     #6a859a;
      --dim:       #3a5060;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(ellipse 120% 80% at 50% 0%, #0e1e30 0%, #060a12 65%);
      color: var(--text);
      font-family: 'Cormorant Garamond', 'Noto Serif JP', 'Noto Serif Arabic', serif;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    body.rtl {
      direction: rtl;
      font-family: 'Noto Serif Arabic', 'Cormorant Garamond', serif;
    }

    /* ── HEADER ── */
    header {
      width: 100%;
      max-width: 760px;
      padding: 28px 24px 0;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
    }

    .title-block h1 {
      font-family: 'Cormorant Garamond', 'Noto Serif JP', serif;
      font-size: 1.85rem;
      font-weight: 400;
      font-style: italic;
      letter-spacing: 0.04em;
      color: var(--primary);
    }
    .title-block p {
      font-family: 'Cormorant Garamond', 'Noto Serif JP', serif;
      font-size: 0.92rem;
      font-weight: 300;
      color: var(--muted);
      margin-top: 5px;
      letter-spacing: 0.06em;
    }

    /* ── LANGUAGE BUTTONS ── */
    .lang-row {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
      padding-top: 4px;
    }
    .lang-btn {
      padding: 5px 13px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      font-size: 0.75rem;
      cursor: pointer;
      transition: all .2s;
      letter-spacing: .03em;
    }
    .lang-btn:hover { color: var(--text); border-color: rgba(126,200,227,.3); }
    .lang-btn.active {
      background: var(--primary-g);
      border-color: rgba(126,200,227,.5);
      color: var(--primary);
    }

    /* ── MAIN ── */
    main {
      width: 100%;
      max-width: 760px;
      padding: 28px 24px 20px;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* ── TABS ── */
    .tabs {
      display: flex;
      gap: 8px;
    }
    .tab-btn {
      flex: 1;
      padding: 11px 10px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: var(--muted);
      font-size: .82rem;
      cursor: pointer;
      transition: all .22s;
      text-align: center;
      line-height: 1.45;
    }
    .tab-btn:hover { color: var(--text); background: rgba(255,255,255,.06); }
    .tab-btn.active {
      background: var(--primary-g);
      border-color: rgba(126,200,227,.4);
      color: var(--primary);
    }

    /* ── EXERCISE CARD ── */
    .ex-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 36px 20px 28px;
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 22px;
      min-height: 420px;
    }
    .ex-card.active { display: flex; }

    .ex-label {
      font-family: 'Cormorant Garamond', 'Noto Serif JP', serif;
      font-size: .82rem;
      font-weight: 400;
      font-style: italic;
      color: var(--muted);
      letter-spacing: .14em;
      text-align: center;
    }

    .instr {
      font-size: .9rem;
      color: var(--text);
      text-align: center;
      line-height: 1.85;
      max-width: 380px;
      min-height: 56px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ── INSTRUCTION ROW (2-column pill layout for ex-0) ── */
    .instr-row {
      display: flex;
      flex-direction: row;
      align-items: stretch;
      justify-content: center;
      gap: 10px;
      width: 100%;
      max-width: 520px;
      flex-wrap: wrap;
    }
    .instr-item {
      flex: 1;
      min-width: 180px;
      background: rgba(126,200,227,.05);
      border: 1px solid rgba(126,200,227,.12);
      border-radius: 12px;
      padding: 10px 16px;
      font-size: .85rem;
      color: var(--text);
      line-height: 1.6;
      text-align: center;
    }
    .instr-item strong { color: var(--primary); font-weight: 600; }

    /* ── EXERCISE 1 : DISTANCE ── */
    .dist-arena {
      width: 280px;
      height: 280px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .ring {
      position: absolute;
      border-radius: 50%;
      border: 1px solid rgba(126,200,227,.08);
      animation: ringBreath 5s ease-in-out infinite;
    }
    .ring-1 { width: 110px; height: 110px; animation-delay: 0s; }
    .ring-2 { width: 190px; height: 190px; animation-delay: -1.7s; }
    .ring-3 { width: 270px; height: 270px; animation-delay: -3.4s; }
    @keyframes ringBreath {
      0%,100% { opacity: .9; } 50% { opacity: .2; }
    }

    .dist-orb {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: radial-gradient(circle at 38% 35%, #c8eaf5, #7ec8e3 55%, #4a90aa);
      box-shadow: 0 0 28px rgba(126,200,227,.45), 0 0 70px rgba(126,200,227,.12);
      position: relative;
      z-index: 2;
    }
    .dist-orb.running {
      animation: distPulse 5s ease-in-out infinite;
    }
    @keyframes distPulse {
      0%   { transform: scale(1.9); opacity: .92;
             box-shadow: 0 0 60px rgba(126,200,227,.6),0 0 130px rgba(126,200,227,.18); }
      50%  { transform: scale(.35); opacity: .45;
             box-shadow: 0 0 10px rgba(126,200,227,.2); }
      100% { transform: scale(1.9); opacity: .92;
             box-shadow: 0 0 60px rgba(126,200,227,.6),0 0 130px rgba(126,200,227,.18); }
    }

    .phase-badge {
      font-family: 'Cormorant Garamond', 'Noto Serif JP', serif;
      font-size: 1.05rem;
      font-weight: 400;
      font-style: italic;
      letter-spacing: .07em;
      color: var(--secondary);
      min-height: 28px;
      text-align: center;
      transition: opacity .5s;
    }

    /* ── EXERCISE 2 : EYE MOVEMENT ── */
    .eye-arena {
      width: 280px;
      height: 280px;
      position: relative;
      border-radius: 14px;
      background: rgba(0,0,0,.25);
      border: 1px solid rgba(126,200,227,.07);
      overflow: hidden;
    }
    .eye-arena::before, .eye-arena::after {
      content: '';
      position: absolute;
      background: rgba(126,200,227,.05);
    }
    .eye-arena::before { width:1px; height:100%; left:50%; }
    .eye-arena::after  { width:100%; height:1px; top:50%; }

    .guide-dot {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: radial-gradient(circle at 40% 38%, #d4f0f8, #7ec8e3 60%, #4a90aa);
      box-shadow: 0 0 14px rgba(126,200,227,.9), 0 0 28px rgba(126,200,227,.35);
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      transition: top .9s cubic-bezier(.42,0,.3,1), left .9s cubic-bezier(.42,0,.3,1);
      z-index: 2;
    }

    .pattern-row {
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .pat-btn {
      padding: 5px 15px;
      border-radius: 18px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      font-size: .78rem;
      cursor: pointer;
      transition: all .2s;
    }
    .pat-btn:hover { color: var(--text); border-color: rgba(126,200,227,.3); }
    .pat-btn.active {
      background: var(--primary-g);
      border-color: rgba(126,200,227,.4);
      color: var(--primary);
    }

    /* ── EXERCISE 3 : BLINK ── */
    .blink-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
    }

    .blink-ring {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      border: 1.5px solid rgba(126,200,227,.2);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    /* SVG progress ring */
    .blink-ring svg {
      position: absolute;
      top: -2px; left: -2px;
      width: calc(100% + 4px);
      height: calc(100% + 4px);
      transform: rotate(-90deg);
    }
    .blink-ring svg circle {
      fill: none;
      stroke: var(--primary);
      stroke-width: 2;
      stroke-linecap: round;
      stroke-dasharray: 490;
      stroke-dashoffset: 490;
      transition: stroke-dashoffset .05s linear;
      opacity: .7;
    }

    .blink-orb {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: radial-gradient(circle at 38% 35%, #c8eaf5, #7ec8e3 55%, #4a90aa);
      box-shadow: 0 0 22px rgba(126,200,227,.5), 0 0 50px rgba(126,200,227,.15);
    }
    .blink-orb.running { animation: blinkPulse 4s ease-in-out infinite; }
    @keyframes blinkPulse {
      0%,100% { opacity: 1;    transform: scale(1);    box-shadow: 0 0 22px rgba(126,200,227,.5),0 0 50px rgba(126,200,227,.15); }
      42%     { opacity: 1;    transform: scale(1.06); box-shadow: 0 0 32px rgba(126,200,227,.7); }
      50%     { opacity: .04;  transform: scale(.93);  box-shadow: none; }
      58%     { opacity: 1;    transform: scale(1);    box-shadow: 0 0 22px rgba(126,200,227,.5); }
    }

    .blink-word {
      font-family: 'Cormorant Garamond', 'Noto Serif JP', 'Noto Serif Arabic', serif;
      font-size: 1.2rem;
      font-weight: 400;
      font-style: italic;
      letter-spacing: .12em;
      color: var(--primary);
      opacity: .4;
    }
    .blink-word.running { animation: blinkWord 4s ease-in-out infinite; }
    @keyframes blinkWord {
      0%,30%,70%,100% { opacity: .35; }
      50% { opacity: 1; }
    }

    .blink-count {
      font-size: 2.4rem;
      font-weight: 200;
      color: var(--muted);
      letter-spacing: .05em;
      min-height: 48px;
    }

    /* ── CONTROLS ── */
    .controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
    }

    .start-btn {
      padding: 13px 52px;
      border-radius: 50px;
      border: none;
      background: linear-gradient(135deg, #4a96b8 0%, #55aa96 100%);
      color: #fff;
      font-size: .95rem;
      letter-spacing: .09em;
      cursor: pointer;
      transition: all .25s;
      box-shadow: 0 4px 22px rgba(74,150,184,.3);
    }
    .start-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 32px rgba(74,150,184,.45);
    }
    .start-btn:active { transform: translateY(0); }
    .start-btn.on {
      background: linear-gradient(135deg, #5a4872 0%, #7a5898 100%);
      box-shadow: 0 4px 22px rgba(90,72,114,.35);
    }

    .timer-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
    }
    .timer-label {
      font-family: 'Cormorant Garamond', 'Noto Serif JP', serif;
      font-size: .78rem;
      font-style: italic;
      color: var(--muted);
      letter-spacing: .07em;
    }
    .elapsed {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.7rem;
      font-weight: 300;
      color: var(--primary);
      letter-spacing: .12em;
      min-width: 60px;
      text-align: center;
    }

    /* ── FOOTER ── */
    footer {
      width: 100%;
      text-align: center;
      padding: 18px 16px;
      color: var(--dim);
      font-size: .75rem;
      letter-spacing: .07em;
      border-top: 1px solid rgba(255,255,255,.04);
      margin-top: 8px;
    }

    /* ── RESPONSIVE ── */
    @media (max-width: 540px) {
      .tabs { flex-direction: column; }
      header { flex-direction: column; }
      .lang-row { align-self: flex-end; }
      .dist-arena, .eye-arena { width: 240px; height: 240px; }
      .ring-3 { width: 230px; height: 230px; }
    }
  </style>
</head>
<body>

<header>
  <div class="title-block">
    <h1 id="h-title">目のケアトレーニング</h1>
    <p id="h-sub">目の疲れをやさしくほぐしましょう</p>
  </div>
  <div class="lang-row">
    <button class="lang-btn active" data-lang="ja">日本語</button>
    <button class="lang-btn"        data-lang="en">EN</button>
    <button class="lang-btn"        data-lang="fa">فارسی</button>
  </div>
</header>

<main>
  <!-- TABS -->
  <div class="tabs">
    <button class="tab-btn active" data-tab="0" id="tb-0"></button>
    <button class="tab-btn"        data-tab="1" id="tb-1"></button>
    <button class="tab-btn"        data-tab="2" id="tb-2"></button>
  </div>

  <!-- ── CARD 0 : Distance ── -->
  <div class="ex-card active" id="card-0">
    <div class="ex-label" id="lbl-0"></div>
    <div class="dist-arena">
      <div class="ring ring-3"></div>
      <div class="ring ring-2"></div>
      <div class="ring ring-1"></div>
      <div class="dist-orb" id="dist-orb"></div>
    </div>
    <div class="phase-badge" id="phase-badge">&nbsp;</div>
    <div class="instr-row" id="instr-0">
      <div class="instr-item" id="instr-0a"></div>
      <div class="instr-item" id="instr-0b"></div>
    </div>
  </div>

  <!-- ── CARD 1 : Eye movement ── -->
  <div class="ex-card" id="card-1">
    <div class="ex-label" id="lbl-1"></div>
    <div class="eye-arena" id="eye-arena">
      <div class="guide-dot" id="guide-dot"></div>
    </div>
    <div class="pattern-row">
      <button class="pat-btn active" data-pat="cross"     id="pb-cross"></button>
      <button class="pat-btn"        data-pat="diagonal"  id="pb-diag"></button>
      <button class="pat-btn"        data-pat="square"    id="pb-sq"></button>
      <button class="pat-btn"        data-pat="circle"    id="pb-circ"></button>
    </div>
    <div class="instr" id="instr-1"></div>
  </div>

  <!-- ── CARD 2 : Blink ── -->
  <div class="ex-card" id="card-2">
    <div class="ex-label" id="lbl-2"></div>
    <div class="blink-wrap">
      <div class="blink-ring" id="blink-ring">
        <svg viewBox="0 0 158 158">
          <circle cx="79" cy="79" r="77" id="blink-progress"/>
        </svg>
        <div class="blink-orb" id="blink-orb"></div>
      </div>
      <div class="blink-word" id="blink-word"></div>
    </div>
    <div class="instr" id="instr-2"></div>
  </div>

  <!-- CONTROLS -->
  <div class="controls">
    <button class="start-btn" id="start-btn"></button>
    <div class="timer-wrap">
      <div class="timer-label" id="timer-label"></div>
      <div class="elapsed" id="elapsed">1:00</div>
    </div>
  </div>
</main>

<footer>Produced by Harmony Flow / Sally</footer>

<script>
// ── i18n ─────────────────────────────────────────────────────────────────────
const T = {
  ja: {
    title:    '目のケアトレーニング',
    sub:      '目の疲れをやさしくほぐしましょう',
    tab0:     '遠くを見る練習',
    tab1:     '眼球運動',
    tab2:     'まばたき練習',
    lbl0:     '距離調節',
    lbl1:     '眼球運動',
    lbl2:     'まばたき促進',
    start:    '開始',
    stop:     '停止',
    timerLabel: '推奨 1分',
    instr0a:  '円が<strong>縮む</strong>とき<br>→ 遠くを意識して',
    instr0b:  '円が<strong>広がる</strong>とき<br>→ 手前を意識して',
    instr1:   '点をゆっくり目で追ってください',
    instr2:   '光が<strong>消えるタイミング</strong>でまばたきしてください',
    phaseFar:  '遠くを見てください',
    phaseNear: '手前を意識してください',
    blinkWord: 'まばたき',
    cross:    '十字',
    diag:     '斜め',
    square:   '四角',
    circle:   '円形',
  },
  en: {
    title:    'Eye Care Training',
    sub:      'Gently relieve eye strain',
    tab0:     'Distance Viewing',
    tab1:     'Eye Movement',
    tab2:     'Blink Practice',
    lbl0:     'Focus Adjustment',
    lbl1:     'Eye Movement',
    lbl2:     'Blink Rhythm',
    start:    'Start',
    stop:     'Stop',
    timerLabel: 'Rec. 1 min',
    instr0a:  'Circle <strong>shrinks</strong><br>→ Focus on the horizon',
    instr0b:  'Circle <strong>grows</strong><br>→ Focus up close',
    instr1:   'Follow the dot slowly with your eyes',
    instr2:   'Blink each time the <strong>light fades</strong>',
    phaseFar:  'Look into the distance',
    phaseNear: 'Focus up close',
    blinkWord: 'Blink',
    cross:    'Cross',
    diag:     'Diagonal',
    square:   'Square',
    circle:   'Circle',
  },
  fa: {
    title:    'تمرین مراقبت از چشم',
    sub:      'خستگی چشم را به آرامی برطرف کنید',
    tab0:     'دید از راه دور',
    tab1:     'حرکت چشم',
    tab2:     'تمرین پلک زدن',
    lbl0:     'تنظیم فاصله',
    lbl1:     'حرکت چشم',
    lbl2:     'ریتم پلک زدن',
    start:    'شروع',
    stop:     'توقف',
    timerLabel: '۱ دقیقه',
    instr0a:  'دایره <strong>کوچک می‌شود</strong><br>→ به دور نگاه کنید',
    instr0b:  'دایره <strong>بزرگ می‌شود</strong><br>→ به نزدیک نگاه کنید',
    instr1:   'نقطه را با چشمانتان دنبال کنید',
    instr2:   'هنگامی که نور <strong>خاموش می‌شود</strong> پلک بزنید',
    phaseFar:  'به دوردست نگاه کنید',
    phaseNear: 'به نزدیک نگاه کنید',
    blinkWord: 'پلک بزنید',
    cross:    'صلیب',
    diag:     'مورب',
    square:   'مربع',
    circle:   'دایره',
  },
};

// ── State ─────────────────────────────────────────────────────────────────────
const DURATION = 60; // fixed 1-minute exercise
let lang      = 'ja';
let activeTab = 0;
let running   = false;
let remaining = DURATION;
let timerIv   = null;
let eyeIv     = null;
let phaseIv   = null;
let blinkIv   = null;
let blinkRafId = null;
let eyePtIdx  = 0;
let curPat    = 'cross';

// ── Patterns ──────────────────────────────────────────────────────────────────
const PATTERNS = {
  cross: [
    [50,50],[50,10],[50,50],[90,50],
    [50,50],[50,90],[50,50],[10,50],
  ],
  diagonal: [
    [50,50],[88,12],[50,50],[12,88],
    [50,50],[12,12],[50,50],[88,88],
  ],
  square: [
    [15,15],[85,15],[85,85],[15,85],
    [15,15],[50,50],
  ],
  circle: (() => {
    const N=12, pts=[];
    for(let i=0;i<=N;i++){
      const a=(i/N)*Math.PI*2-Math.PI/2;
      pts.push([Math.round(50+40*Math.cos(a)), Math.round(50+40*Math.sin(a))]);
    }
    return pts;
  })(),
};

// ── Render ────────────────────────────────────────────────────────────────────
function applyLang() {
  const t = T[lang];
  document.getElementById('h-title').textContent   = t.title;
  document.getElementById('h-sub').textContent      = t.sub;
  document.getElementById('tb-0').textContent       = t.tab0;
  document.getElementById('tb-1').textContent       = t.tab1;
  document.getElementById('tb-2').textContent       = t.tab2;
  document.getElementById('lbl-0').textContent      = t.lbl0;
  document.getElementById('lbl-1').textContent      = t.lbl1;
  document.getElementById('lbl-2').textContent      = t.lbl2;
  document.getElementById('instr-0a').innerHTML     = t.instr0a;
  document.getElementById('instr-0b').innerHTML     = t.instr0b;
  document.getElementById('timer-label').textContent = t.timerLabel;
  document.getElementById('instr-1').textContent    = t.instr1;
  document.getElementById('instr-2').innerHTML      = t.instr2;
  document.getElementById('blink-word').textContent = t.blinkWord;
  document.getElementById('pb-cross').textContent   = t.cross;
  document.getElementById('pb-diag').textContent    = t.diag;
  document.getElementById('pb-sq').textContent      = t.square;
  document.getElementById('pb-circ').textContent    = t.circle;
  document.getElementById('start-btn').textContent  = running ? t.stop : t.start;

  document.documentElement.lang = lang;
  document.body.classList.toggle('rtl', lang === 'fa');
}

// ── Language ──────────────────────────────────────────────────────────────────
document.querySelectorAll('.lang-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    lang = btn.dataset.lang;
    document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    applyLang();
  });
});

// ── Tabs ──────────────────────────────────────────────────────────────────────
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    if (running) stopEx();
    activeTab = +btn.dataset.tab;
    document.querySelectorAll('.tab-btn').forEach((b,i) => b.classList.toggle('active', i === activeTab));
    document.querySelectorAll('.ex-card').forEach((c,i) => c.classList.toggle('active', i === activeTab));
  });
});

// ── Pattern buttons ───────────────────────────────────────────────────────────
document.querySelectorAll('.pat-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    curPat = btn.dataset.pat;
    eyePtIdx = 0;
    document.querySelectorAll('.pat-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  });
});

// ── Timer ─────────────────────────────────────────────────────────────────────
function fmtTime(s) {
  return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
}

// ── Start / Stop ──────────────────────────────────────────────────────────────
document.getElementById('start-btn').addEventListener('click', () => {
  running ? stopEx() : startEx();
});

function startEx() {
  running = true;
  remaining = DURATION;
  document.getElementById('elapsed').textContent = fmtTime(remaining);
  const btn = document.getElementById('start-btn');
  btn.textContent = T[lang].stop;
  btn.classList.add('on');

  timerIv = setInterval(() => {
    remaining--;
    document.getElementById('elapsed').textContent = fmtTime(remaining);
    if (remaining <= 0) stopEx();
  }, 1000);

  if (activeTab === 0) startDist();
  if (activeTab === 1) startEye();
  if (activeTab === 2) startBlink();
}

function stopEx() {
  running = false;
  clearInterval(timerIv);
  clearInterval(eyeIv);
  clearInterval(phaseIv);
  clearInterval(blinkIv);
  cancelAnimationFrame(blinkRafId);

  const btn = document.getElementById('start-btn');
  btn.textContent = T[lang].start;
  btn.classList.remove('on');

  // clean distance
  document.getElementById('dist-orb').classList.remove('running');
  document.getElementById('phase-badge').innerHTML = '&nbsp;';

  // clean eye
  const dot = document.getElementById('guide-dot');
  dot.style.top  = '50%';
  dot.style.left = '50%';

  // clean blink
  document.getElementById('blink-orb').classList.remove('running');
  document.getElementById('blink-word').classList.remove('running');
  document.getElementById('blink-progress').style.strokeDashoffset = '490';
  remaining = DURATION;
  document.getElementById('elapsed').textContent = fmtTime(remaining);
}

// ── Ex 0 : Distance ───────────────────────────────────────────────────────────
function startDist() {
  const orb = document.getElementById('dist-orb');
  orb.classList.add('running');

  // 5 s cycle: first 2.5 s shrinking (far), next 2.5 s growing (near)
  let phase = 'far';
  document.getElementById('phase-badge').textContent = T[lang].phaseFar;

  phaseIv = setInterval(() => {
    phase = (phase === 'far') ? 'near' : 'far';
    document.getElementById('phase-badge').textContent =
      (phase === 'far') ? T[lang].phaseFar : T[lang].phaseNear;
  }, 2500);
}

// ── Ex 1 : Eye Movement ───────────────────────────────────────────────────────
function startEye() {
  eyePtIdx = 0;
  moveDot();
  eyeIv = setInterval(moveDot, 1100);
}

function moveDot() {
  const pts = PATTERNS[curPat];
  const [x, y] = pts[eyePtIdx % pts.length];
  const dot = document.getElementById('guide-dot');
  dot.style.left = x + '%';
  dot.style.top  = y + '%';
  eyePtIdx++;
}

// ── Ex 2 : Blink ──────────────────────────────────────────────────────────────
function startBlink() {
  document.getElementById('blink-orb').classList.add('running');
  document.getElementById('blink-word').classList.add('running');

  // Progress ring: 4 s cycle, CIRCUMFERENCE = 2πr ≈ 2×3.14159×77 ≈ 483.8
  const CIRC = 2 * Math.PI * 77;   // ~483.8
  const PERIOD = 4000; // ms
  const circle = document.getElementById('blink-progress');
  circle.style.strokeDasharray  = CIRC;
  circle.style.strokeDashoffset = CIRC;
  circle.style.transition = 'none';

  let start = null;
  function tick(ts) {
    if (!running) return;
    if (!start) start = ts;
    const t = (ts - start) % PERIOD;
    const progress = t / PERIOD;  // 0→1
    circle.style.strokeDashoffset = CIRC * (1 - progress);
    blinkRafId = requestAnimationFrame(tick);
  }
  blinkRafId = requestAnimationFrame(tick);
}

// ── Init ──────────────────────────────────────────────────────────────────────
applyLang();
</script>
</body>
</html>
